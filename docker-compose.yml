version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendoros
      POSTGRES_PASSWORD: vendoros
      POSTGRES_DB: vendoros
    ports:
      - "5432:5432"
    volumes:
      - vendoros_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vendoros_redis_data:/data

volumes:
  vendoros_postgres_data:
  vendoros_redis_data:
